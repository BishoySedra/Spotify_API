name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.ts"

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Run service tests
        run: npm run test:service -- --ci

      - name: Run controller tests
        run: npm run test:controller -- --ci

      - name: Run helper tests
        run: npm run test:helper -- --ci

      - name: Run guard tests
        run: npm run test:guard -- --ci

      - name: Run filter tests
        run: npm run test:filter -- --ci

      - name: Run all tests with coverage
        run: npm test -- --ci --coverage

      - name: Coverage summary
        if: always() && matrix.node-version == 20
        run: |
          node -e "
          const r = require('./coverage/coverage-summary.json');
          const fmt = (m) => {
            const pct = m.pct;
            const icon = pct >= 80 ? '🟢' : pct >= 60 ? '🟡' : '🔴';
            return icon + ' ' + pct + '%';
          };
          const rows = Object.entries(r)
            .filter(([k]) => k !== 'total')
            .map(([file, d]) => [
              file.replace(/^.*src\//, 'src/'),
              fmt(d.statements),
              fmt(d.branches),
              fmt(d.functions),
              fmt(d.lines),
            ]);
          const t = r.total;
          let md = '## Test Coverage Report\n\n';
          md += '### Overall\n\n';
          md += '| Metric | Coverage |\n|---|---|\n';
          md += '| Statements | ' + fmt(t.statements) + ' (' + t.statements.covered + '/' + t.statements.total + ') |\n';
          md += '| Branches | ' + fmt(t.branches) + ' (' + t.branches.covered + '/' + t.branches.total + ') |\n';
          md += '| Functions | ' + fmt(t.functions) + ' (' + t.functions.covered + '/' + t.functions.total + ') |\n';
          md += '| Lines | ' + fmt(t.lines) + ' (' + t.lines.covered + '/' + t.lines.total + ') |\n\n';
          md += '### Per File\n\n';
          md += '| File | Statements | Branches | Functions | Lines |\n';
          md += '|---|---|---|---|---|\n';
          rows.forEach(r => md += '| ' + r.join(' | ') + ' |\n');
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          "

      - name: Upload coverage report
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify dist output exists
        run: test -d dist
